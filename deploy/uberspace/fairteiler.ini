; ~/etc/services.d/fairteiler.ini — replace <user> with your Uberspace username
[program:fairteiler-api]
directory=/home/<user>/fairteiler-repo/backend
command=/bin/bash -c "set -a; source /home/<user>/fairteiler/env; exec /home/<user>/fairteiler/venv/bin/uvicorn run:app --host 127.0.0.1 --port 8000"
environment=PYTHONUNBUFFERED=1
autostart=true
autorestart=true
startsecs=10
